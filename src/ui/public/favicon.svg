<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Orbit ring: 6 nodes {1,2,4,8,7,5} at hexagonal positions (r=10.5).
    Complement {3,6} on inner ring (r=5.5), at 120° and 240°.
    9 (fixed point) at center.
  -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e2212"/>
      <stop offset="100%" stop-color="#020809"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="5" fill="url(#bg)"/>

  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#1a4020" stroke-width="0.6"/>

  <!-- Orbit nodes {1,2,4,8,7,5} — hexagonal, r=10.5 -->
  <circle cx="16"    cy="5.5"  r="2.5" fill="#00ee7a"/>  <!-- 1 @ top     -->
  <circle cx="24.6"  cy="10.5" r="2.5" fill="#00ee7a"/>  <!-- 2 @ upper-R -->
  <circle cx="24.6"  cy="21.5" r="2.5" fill="#00ee7a"/>  <!-- 4 @ lower-R -->
  <circle cx="16"    cy="26.5" r="2.5" fill="#00ee7a"/>  <!-- 8 @ bottom  -->
  <circle cx="7.4"   cy="21.5" r="2.5" fill="#00ee7a"/>  <!-- 7 @ lower-L -->
  <circle cx="7.4"   cy="10.5" r="2.5" fill="#00ee7a"/>  <!-- 5 @ upper-L -->

  <!-- Complement {3,6} — inner ring r=5.5, at 120° and 240° -->
  <circle cx="20.8" cy="18.75" r="1.6" fill="#ff9d00"/>  <!-- 3 @ 120° -->
  <circle cx="11.2" cy="18.75" r="1.6" fill="#ff9d00"/>  <!-- 6 @ 240° -->

  <!-- 9 — fixed point, center -->
  <circle cx="16" cy="16" r="1.6" fill="#e8e8e8" opacity="0.88"/>
</svg>
