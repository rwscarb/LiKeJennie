<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0d2010"/>
      <stop offset="100%" stop-color="#020709"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="url(#bg)"/>

  <!-- Orbit ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#1c3d1c" stroke-width="0.5"/>

  <!-- Hexagram — two overlapping triangles carving the orbit into {1,4,7} and {2,5,8} -->
  <polygon points="16,5 25.5,21.5 6.5,21.5"
           fill="none" stroke="#00cc55" stroke-width="0.65" stroke-linejoin="round" opacity="0.45"/>
  <polygon points="25.5,10.5 16,27 6.5,10.5"
           fill="none" stroke="#00cc55" stroke-width="0.65" stroke-linejoin="round" opacity="0.45"/>

  <!-- Orbit nodes {1,2,4,8,7,5} — green -->
  <circle cx="16"   cy="5"    r="2.3" fill="#00ff88"/>
  <circle cx="25.5" cy="10.5" r="2.3" fill="#00ff88"/>
  <circle cx="25.5" cy="21.5" r="2.3" fill="#00ff88"/>
  <circle cx="16"   cy="27"   r="2.3" fill="#00ff88"/>
  <circle cx="6.5"  cy="21.5" r="2.3" fill="#00ff88"/>
  <circle cx="6.5"  cy="10.5" r="2.3" fill="#00ff88"/>

  <!-- Complement {3,6} — amber, inner ring -->
  <circle cx="16" cy="10.8" r="1.45" fill="#ffaa00"/>
  <circle cx="16" cy="21.2" r="1.45" fill="#ffaa00"/>

  <!-- 9 — fixed point, center -->
  <circle cx="16" cy="16" r="1.35" fill="#ffffff" opacity="0.82"/>
</svg>
