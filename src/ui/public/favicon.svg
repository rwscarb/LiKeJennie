<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Orbit traversal: 1→2→4→8→7→5→1 as a closed polygon.
    Nodes placed at their value position on a 9-point clock (value/9 × 360°).
    V1=40° V2=80° V4=160° V5=200° V7=280° V8=320°
    The 4→8 and 5→1 segments cross the center — creates a pinwheel, not a hexagram.
  -->
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0d2010"/>
      <stop offset="100%" stop-color="#020709"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="4" fill="url(#bg)"/>

  <!-- Orbit traversal path: 1(22.8,8)→2(26.3,14.2)→4(19.6,25.9)→8(9.2,8)→7(5.7,14.2)→5(12.4,25.9)→close -->
  <polygon
    points="22.8,8 26.3,14.2 19.6,25.9 9.2,8 5.7,14.2 12.4,25.9"
    fill="none" stroke="#00cc55" stroke-width="0.65" stroke-linejoin="round" opacity="0.5"/>

  <!-- Orbit nodes {1,2,4,8,7,5} at value-angle positions, r=10.5 -->
  <circle cx="22.8" cy="8"    r="2.2" fill="#00ff88"/>  <!-- 1 @ 40° -->
  <circle cx="26.3" cy="14.2" r="2.2" fill="#00ff88"/>  <!-- 2 @ 80° -->
  <circle cx="19.6" cy="25.9" r="2.2" fill="#00ff88"/>  <!-- 4 @ 160° -->
  <circle cx="12.4" cy="25.9" r="2.2" fill="#00ff88"/>  <!-- 5 @ 200° -->
  <circle cx="5.7"  cy="14.2" r="2.2" fill="#00ff88"/>  <!-- 7 @ 280° -->
  <circle cx="9.2"  cy="8"    r="2.2" fill="#00ff88"/>  <!-- 8 @ 320° -->

  <!-- Complement {3,6} at inner ring r=5, value-angle positions -->
  <circle cx="20.3" cy="18.5" r="1.4" fill="#ffaa00"/>  <!-- 3 @ 120° -->
  <circle cx="11.7" cy="18.5" r="1.4" fill="#ffaa00"/>  <!-- 6 @ 240° -->

  <!-- 9 — fixed point, center -->
  <circle cx="16" cy="16" r="1.3" fill="#ffffff" opacity="0.82"/>
</svg>
