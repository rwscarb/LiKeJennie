<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="3" fill="#020c08"/>
  <!-- orbit ring guide -->
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#0d200d" stroke-width="0.9"/>
  <!-- 6 orbit nodes {1,2,4,5,7,8} — green -->
  <circle cx="16"   cy="4.5"  r="2.4" fill="#00ff88"/>
  <circle cx="26"   cy="10.5" r="2.4" fill="#00ff88"/>
  <circle cx="26"   cy="21.5" r="2.4" fill="#00ff88"/>
  <circle cx="16"   cy="27.5" r="2.4" fill="#00ff88"/>
  <circle cx="6"    cy="21.5" r="2.4" fill="#00ff88"/>
  <circle cx="6"    cy="10.5" r="2.4" fill="#00ff88"/>
  <!-- complement {3,6} — amber, inner ring r=5.5 -->
  <circle cx="16"   cy="10.5" r="1.5" fill="#ff9800"/>
  <circle cx="16"   cy="21.5" r="1.5" fill="#ff9800"/>
  <!-- fixed point 9 — white, center -->
  <circle cx="16"   cy="16"   r="1.1" fill="#ffffff" opacity="0.55"/>
</svg>
